<div class="toast-stack">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast"
      [class.toast--success]="toast.severity === 'success'"
      [class.toast--error]="toast.severity === 'error'"
      [class.toast--warning]="toast.severity === 'warning'"
      [class.toast--info]="toast.severity === 'info'"
      [class.toast--leaving]="toast.leaving"
      [attr.role]="toast.severity === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="toast.severity === 'error' ? 'assertive' : 'polite'"
      (mouseenter)="pause(toast)"
      (mouseleave)="resume(toast)"
    >
      <mat-icon class="toast__icon">{{ iconFor(toast.severity) }}</mat-icon>

      <span class="toast__message">{{ toast.message }}</span>

      @if (toast.actionLabel) {
        <button mat-button class="toast__action" (click)="runAction(toast)">
          {{ toast.actionLabel }}
        </button>
      }

      <button
        mat-icon-button
        class="toast__close"
        aria-label="Dismiss notification"
        (click)="dismiss(toast)"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
</div>
