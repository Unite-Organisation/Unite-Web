<div class="dialog-container">
  <h2 mat-dialog-title>Create New Announcement</h2>

  <mat-dialog-content>

    <div *ngIf="isLoadingBuildings" class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading buildings...</p>
    </div>

    <form
      *ngIf="!isLoadingBuildings"
      [formGroup]="form"
      class="announcement-form"
    >

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Announcement Name</mat-label>

        <input
          matInput
          formControlName="name"
          placeholder="e.g. Water maintenance"
        />

        <mat-error *ngIf="form.controls['name'].hasError('required')">
          Name is required
        </mat-error>
      </mat-form-field>


      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Building</mat-label>

        <mat-select formControlName="buildingId">
          <mat-option
            *ngFor="let building of buildings"
            [value]="building.id"
          >
            {{ building.name }}
            ({{ building.street }} {{ building.number }},
            {{ building.city }})
          </mat-option>
        </mat-select>

        <mat-error *ngIf="form.controls['buildingId'].hasError('required')">
          Building is required
        </mat-error>
      </mat-form-field>


      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Content</mat-label>

        <textarea
          matInput
          formControlName="content"
          rows="5"
          placeholder="Write the announcement..."
        ></textarea>

        <mat-error *ngIf="form.controls['content'].hasError('required')">
          Content is required
        </mat-error>
      </mat-form-field>


      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Related Date</mat-label>

        <input
          matInput
          [matDatepicker]="picker"
          formControlName="relatedDate"
        />

        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"
        ></mat-datepicker-toggle>

        <mat-datepicker #picker></mat-datepicker>

        <mat-error *ngIf="form.controls['relatedDate'].hasError('required')">
          Date is required
        </mat-error>
      </mat-form-field>

    </form>

  </mat-dialog-content>


  <mat-dialog-actions>

    <app-button
      variant="ghost"
      size="md"
      type="button"
      (clicked)="cancel()"
    >
      Cancel
    </app-button>

    <app-button
      variant="primary"
      size="md"
      type="button"
      [disabled]="form.invalid || isSubmitting || isLoadingBuildings"
      (clicked)="submit()"
    >
      <ng-container *ngIf="!isSubmitting; else submittingTpl">
        Create Announcement
      </ng-container>

      <ng-template #submittingTpl>
        Creating...
      </ng-template>
    </app-button>

  </mat-dialog-actions>
</div>
