<div class="dialog-container">
  <h2 mat-dialog-title>Create New Tournament</h2>

  <mat-dialog-content>
    <form [formGroup]="form" class="tournament-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g., Spring Table Tennis Cup" />
        <mat-error *ngIf="form.controls['name'].hasError('required')">
          Name is required
        </mat-error>
        <mat-error *ngIf="form.controls['name'].hasError('minlength')">
          Name must be at least 3 characters
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"
                  placeholder="Describe the tournament rules and details..."
                  rows="4"></textarea>
        <mat-error *ngIf="form.controls['description'].hasError('required')">
          Description is required
        </mat-error>
        <mat-error *ngIf="form.controls['description'].hasError('minlength')">
          Description must be at least 5 characters
        </mat-error>
      </mat-form-field>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Type</mat-label>
          <mat-select formControlName="type">
            <mat-option *ngFor="let type of types" [value]="type">
              <mat-icon>{{ getTypeIcon(type) }}</mat-icon>
              {{ getTypeLabel(type) }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls['type'].hasError('required')">
            Type is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Team size</mat-label>
          <input matInput type="number" formControlName="teamSize" min="1" step="1" />
          <mat-error *ngIf="form.controls['teamSize'].hasError('required')">
            Team size is required
          </mat-error>
          <mat-error *ngIf="form.controls['teamSize'].hasError('min')">
            Team size must be at least 1
          </mat-error>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="button" (click)="submit()"
            [disabled]="form.invalid || isSubmitting">
      <span *ngIf="!isSubmitting">Create Tournament</span>
      <mat-spinner *ngIf="isSubmitting" diameter="20"></mat-spinner>
    </button>
  </mat-dialog-actions>
</div>
