<div class="dialog-container">
  <h2 mat-dialog-title>Add Participants</h2>

  <mat-dialog-content>
    <div class="tournament-info">
      <p><strong>Tournament:</strong> {{ data.tournament.name }}</p>
      <p><strong>Current participants:</strong> {{ data.tournament.participants.length }}</p>
    </div>

    <div class="members-section">
      <div class="members-header">
        <h3>Select residents to add</h3>
        <span class="selection-count" [class.valid]="selectedCount > 0">
          Selected: {{ selectedCount }}
        </span>
      </div>

      <div *ngIf="isLoadingUsers" class="loading-container">
        <mat-spinner diameter="32"></mat-spinner>
        <p>Loading users...</p>
      </div>

      <div *ngIf="!isLoadingUsers && users.length === 0" class="empty-state">
        <mat-icon>people_outline</mat-icon>
        <p>No available users to add</p>
      </div>

      <div *ngIf="!isLoadingUsers && users.length > 0" class="users-list">
        <div
          *ngFor="let user of users"
          class="user-item"
          [class.selected]="isSelected(user.basicUserData.id)"
          (click)="toggleSelection(user.basicUserData.id)">
          <mat-checkbox
            [checked]="isSelected(user.basicUserData.id)"
            (click)="$event.stopPropagation()"
            (change)="toggleSelection(user.basicUserData.id)">
          </mat-checkbox>
          <div class="user-avatar">
            <mat-icon>person</mat-icon>
          </div>
          <div class="user-info">
            <span class="user-name">{{ getFullName(user) }}</span>
            <span class="user-building">{{ user.buildingName }}</span>
          </div>
        </div>
      </div>

      <mat-paginator
        *ngIf="!isLoadingUsers && users.length > 0"
        [length]="totalUsers"
        [pageSize]="pagination.pageSize"
        [pageIndex]="pagination.page - 1"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button type="button" (click)="cancel()" [disabled]="isSubmitting">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="submit()"
      [disabled]="selectedCount === 0 || isSubmitting || isLoadingUsers">
      <span *ngIf="!isSubmitting">Add participants</span>
      <mat-spinner *ngIf="isSubmitting" diameter="20"></mat-spinner>
    </button>
  </mat-dialog-actions>
</div>
